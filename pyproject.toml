[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-expense-demo"
version = "0.1.0"
description = "A small expense tracker with one documented demonstration bug"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tiny-expense = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["expense_tracker*"]
